name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    container: ruby:${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.3', '2.4', '2.5', '2.6']

    env:
      QT_SELECT: qt5
      QMAKE: /usr/lib/qt5/bin/qmake

    steps:
      - name: Fix APT for EOL Debian
        run: |
          if grep -q stretch /etc/apt/sources.list 2>/dev/null; then
            echo "deb [trusted=yes] http://archive.debian.org/debian stretch main" > /etc/apt/sources.list
          elif grep -q buster /etc/apt/sources.list 2>/dev/null; then
            echo "deb [trusted=yes] http://archive.debian.org/debian buster main" > /etc/apt/sources.list
            echo "deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list
          fi
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          echo 'Acquire::AllowInsecureRepositories "true";' >> /etc/apt/apt.conf.d/99archive

      - name: Install system packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git ca-certificates curl bzip2 \
            build-essential g++ \
            qt5-qmake qtbase5-dev libqt5webkit5-dev qtchooser \
            xvfb libfontconfig1 libfreetype6 libxrender1 libxext6 libx11-6

      - name: Install PhantomJS
        run: |
          export PHANTOMJS_VERSION='2.1.1'
          curl -L -o phantomjs.tar.bz2 "https://github.com/Medium/phantomjs/releases/download/v${PHANTOMJS_VERSION}/phantomjs-${PHANTOMJS_VERSION}-linux-x86_64.tar.bz2"
          tar xf phantomjs.tar.bz2 --wildcards '*/bin/phantomjs' --strip-components=2
          mv phantomjs /usr/local/bin/
          rm phantomjs.tar.bz2
          phantomjs --version

      - name: Checkout
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Install Bundler
        run: gem install bundler -v '< 2'

      - name: Bundle install
        run: |
          bundle config set force_ruby_platform true
          bundle install --jobs 4 --retry 3

      - name: Run tests
        run: xvfb-run -a bundle exec rspec spec
