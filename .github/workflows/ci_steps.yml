name: "Ruby Gem CI"

on:
  push:
  pull_request:

jobs:
  rspec:
    name: "rspec (Ruby ${{ matrix.ruby-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.3.8', '2.4', '2.5', '2.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Install Bundler v1
        run: gem install bundler -v '< 2'

      - name: Use Ruby 2.x compatible ffi (CI-only)
        run: |
          bundle config set force_ruby_platform true
          cp Gemfile Gemfile.ci
          echo "gem 'ffi', '~> 1.15'" >> Gemfile.ci

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev libqt5webkit5-dev g++ xvfb openssl \
            libfontconfig1 libfreetype6 libxrender1 libxext6 libx11-6 libxss1 libxtst6 libxcb1 libxcb-glx0
          if ! dpkg -s libssl1.1 >/dev/null 2>&1; then
            wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl1.1/libssl1.1_1.1.1f-1ubuntu2.22_amd64.deb
            sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2.22_amd64.deb || sudo apt-get -f install -y
          fi

      - name: Install PhantomJS
        env:
          OPENSSL_CONF: /etc/ssl/openssl.cnf
          OPENSSL_MODULES: /usr/lib/x86_64-linux-gnu/ossl-modules
        run: |
          export PHANTOMJS_VERSION='2.1.1'
          export PHANTOMJS_URL="https://github.com/Medium/phantomjs/releases/download/v${PHANTOMJS_VERSION}/phantomjs-${PHANTOMJS_VERSION}-linux-x86_64.tar.bz2"
          wget -q ${PHANTOMJS_URL}
          tar xfj phantomjs-${PHANTOMJS_VERSION}-linux-x86_64.tar.bz2 --wildcards */bin/phantomjs --strip-components=2
          sudo mv phantomjs /usr/local/bin/phantomjs
          phantomjs --version

      - name: Install gems
        run: BUNDLE_GEMFILE=Gemfile.ci bundle install

      - name: rspec
        run: BUNDLE_GEMFILE=Gemfile.ci xvfb-run -a bundle exec rspec spec --format documentation
