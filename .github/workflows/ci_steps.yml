# This workflow installs Ruby, installs gems, and runs tests.
name: "Ruby Gem CI"
on:
  push:
  pull_request:

jobs:
  rspec:
    name: "rspec (Ruby ${{ matrix.ruby-version }})"
    runs-on: ubuntu-22.04
    env:
      FFI_VERSION: 1.15.5
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.3', '2.4', '2.5', '2.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Install Bundler v1
        run: gem install bundler -v 1.17.3

      - name: Pin ffi for Ruby 2.x and force ruby platform
        run: |
          gem install ffi -v "$FFI_VERSION"
          bundle _1.17.3_ config set force_ruby_platform true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev libqt5webkit5-dev g++ xvfb

      - name: Install PhantomJS
        run: |
          export PHANTOMJS_VERSION='2.1.1'
          export PHANTOMJS_URL="https://github.com/Medium/phantomjs/releases/download/v${PHANTOMJS_VERSION}/phantomjs-${PHANTOMJS_VERSION}-linux-x86_64.tar.bz2"
          wget -q ${PHANTOMJS_URL}
          tar xfj phantomjs-${PHANTOMJS_VERSION}-linux-x86_64.tar.bz2 --wildcards */bin/phantomjs --strip-components=2
          sudo mv phantomjs /usr/local/bin/phantomjs
          phantomjs --version

      - name: Install gems
        run: bundle _1.17.3_ install

      - name: rspec
        run: bundle _1.17.3_ exec rspec spec
