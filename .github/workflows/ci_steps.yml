name: "Ruby Gem CI"

on:
  push:
  pull_request:

jobs:
  rspec:
    name: "rspec (Ruby ${{ matrix.ruby-version }})"
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest uses OpenSSL 3; PhantomJS 2.1.1 can trip over provider-loading config.
      # Disable OpenSSL config/module loading for the CI process.
      OPENSSL_CONF: /dev/null
      OPENSSL_MODULES: ""
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.3.8', '2.4', '2.5', '2.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Install Bundler v1
        run: gem install bundler -v '< 2'

      - name: Use Ruby 2.x compatible ffi (CI-only)
        run: |
          bundle config set force_ruby_platform true
          cp Gemfile Gemfile.ci
          echo "gem 'ffi', '~> 1.15'" >> Gemfile.ci

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bzip2 curl \
            build-essential g++ xvfb \
            libssl-dev \
            qt5-qmake qtbase5-dev libqt5webkit5-dev

      - name: Install PhantomJS
        run: |
          sudo mkdir -p /tmp/phantomjs
          curl -L https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-linux-x86_64.tar.bz2 \
            | sudo tar -xj --strip-components=1 -C /tmp/phantomjs
          sudo mv /tmp/phantomjs/bin/phantomjs /usr/local/bin/phantomjs
          sudo rm -rf /tmp/phantomjs
          phantomjs --version

      - name: Install gems
        run: BUNDLE_GEMFILE=Gemfile.ci bundle install

      - name: rspec
        run: BUNDLE_GEMFILE=Gemfile.ci xvfb-run -a bundle exec rspec spec --format documentation
