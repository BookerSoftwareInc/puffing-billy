name: "Ruby Gem CI"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rspec:
    name: "rspec (Ruby ${{ matrix.ruby-version }})"
    runs-on: ubuntu-latest
    # Run inside ubuntu-20.04 userland for PhantomJS + old Rubies, while still using ubuntu-latest runners (no queue).
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["2.3.8", "2.4", "2.5", "2.6"]

    steps:
      - name: Install base packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git curl bzip2

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Install Bundler v1 (Travis parity)
        run: gem install bundler -v '< 2'

      - name: Use Ruby 2.x compatible ffi (CI-only)
        run: |
          bundle config set force_ruby_platform true
          cp Gemfile Gemfile.ci
          echo "gem 'ffi', '~> 1.15'" >> Gemfile.ci

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential g++ xvfb \
            libssl-dev \
            qt5-qmake qtbase5-dev libqt5webkit5-dev \
            libfontconfig1 libfreetype6 libxrender1 libxext6 libx11-6 libxss1 libxtst6 libxcb1 libxcb-glx0

      - name: Install PhantomJS 2.1.1
        run: |
          mkdir -p /tmp/phantomjs
          curl -L https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-linux-x86_64.tar.bz2 \
            | tar -xj --strip-components=1 -C /tmp/phantomjs
          mv /tmp/phantomjs/bin/phantomjs /usr/local/bin/phantomjs
          rm -rf /tmp/phantomjs
          phantomjs --version

      - name: Install gems
        run: BUNDLE_GEMFILE=Gemfile.ci bundle install

      - name: rspec
        run: BUNDLE_GEMFILE=Gemfile.ci xvfb-run -a bundle exec rspec spec --format documentation
