name: "Ruby Gem CI"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rspec:
    name: "rspec (Ruby ${{ matrix.ruby-version }})"
    runs-on: ubuntu-latest
    container: ${{ matrix.container_image }}
    env:
      QT_SELECT: qt5
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: "2.3.8"
            container_image: "ruby:2.3"
          - ruby-version: "2.4"
            container_image: "ruby:2.4"
          - ruby-version: "2.5"
            container_image: "ruby:2.5"
          - ruby-version: "2.6"
            container_image: "ruby:2.6"

    steps:
      - name: Fix APT sources for EOL Debian versions
        run: |
          # Detect Debian version and fix APT sources for EOL releases
          if grep -q "stretch" /etc/apt/sources.list 2>/dev/null; then
            echo "Detected Debian Stretch (EOL) - switching to archive"
            printf '%s\n' 'deb [trusted=yes] http://archive.debian.org/debian stretch main' > /etc/apt/sources.list
          elif grep -q "buster" /etc/apt/sources.list 2>/dev/null; then
            echo "Detected Debian Buster (EOL) - switching to archive"
            printf '%s\n' \
              'deb [trusted=yes] http://archive.debian.org/debian buster main' \
              'deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main' \
              > /etc/apt/sources.list
          fi
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          echo 'Acquire::AllowInsecureRepositories "true";' > /etc/apt/apt.conf.d/99allow-insecure
          echo 'Acquire::AllowDowngradeToInsecureRepositories "true";' >> /etc/apt/apt.conf.d/99allow-insecure

      - name: Install base packages
        run: |
          apt-get update -qq -o Acquire::Check-Valid-Until=false
          apt-get install -y --no-install-recommends ca-certificates git curl bzip2 unzip

      - name: Checkout code
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Install Bundler v1 (Travis parity)
        run: gem install bundler -v '< 2'

      - name: Use Ruby 2.x compatible ffi (CI-only)
        run: |
          bundle config set force_ruby_platform true
          cp Gemfile Gemfile.ci
          echo "gem 'ffi', '~> 1.15'" >> Gemfile.ci

      - name: Install system dependencies
        run: |
          apt-get update -qq -o Acquire::Check-Valid-Until=false
          apt-get install -y --no-install-recommends \
            build-essential g++ xvfb \
            libssl-dev \
            qt5-qmake qtbase5-dev libqt5webkit5-dev qtchooser \
            libfontconfig1 libfreetype6 libxrender1 libxext6 libx11-6 libxss1 libxtst6 libxcb1 libxcb-glx0

      - name: Install PhantomJS 2.1.1
        run: |
          mkdir -p /tmp/phantomjs
          curl -L https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-linux-x86_64.tar.bz2 \
            | tar -xj --strip-components=1 -C /tmp/phantomjs
          mv /tmp/phantomjs/bin/phantomjs /usr/local/bin/phantomjs
          rm -rf /tmp/phantomjs
          phantomjs --version

      - name: Install gems
        env:
          QMAKE: /usr/lib/qt5/bin/qmake
        run: BUNDLE_GEMFILE=Gemfile.ci bundle install

      - name: rspec
        run: BUNDLE_GEMFILE=Gemfile.ci xvfb-run -a bundle exec rspec spec --format documentation
